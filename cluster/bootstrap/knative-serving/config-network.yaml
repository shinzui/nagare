# Patch body for the knative-serving `config-network` ConfigMap.
#
# M2 (active, HTTP): select Kourier as the ingress class. This is the only key
# applied in the HTTP-first bootstrap.
#
# The two automatic-TLS keys are intentionally NOT here — they live in
# `config-network-tls.yaml` and are applied only once a real `baseDomain` is
# delegated (enabling them now would make Knative request a wildcard cert that
# cannot be issued for the placeholder domain). See this directory's README.
data:
  ingress-class: kourier.ingress.networking.knative.dev
  # Single-tenant PaaS: let DomainMappings create their own ClusterDomainClaim
  # automatically. Without this (default "false"), every custom-domain mapping
  # (e.g. nagarectl's `domain:` field, EP-6) needs an admin-created
  # ClusterDomainClaim first. There is only one tenant here, so autocreation is
  # safe and is what makes `nagarectl` able to map arbitrary domains.
  autocreate-cluster-domain-claims: "true"
