apiVersion: v1
kind: Namespace
metadata:
  name: nagare-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shomei
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: shomei
    app.kubernetes.io/part-of: nagare-auth-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shomei
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shomei
        app.kubernetes.io/part-of: nagare-auth-plane
    spec:
      containers:
        - name: shomei
          image: us-west1-docker.pkg.dev/tan-nb-exp/nagare/shomei:latest
          ports:
            - containerPort: 8080
          env:
            - name: PGHOST
              value: shomei-db.nagare-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nagare-db-shomei-db
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nagare-db-shomei-db
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: nagare-db-shomei-db
                  key: POSTGRES_DB
            - name: PG_CONNECTION_STRING
              value: "host=$(PGHOST) port=$(PGPORT) dbname=$(PGDATABASE) user=$(PGUSER) password=$(PGPASSWORD)"
            - name: SHOMEI_PORT
              value: "8080"
            - name: SHOMEI_ISSUER
              value: "nagare-shomei"
            - name: SHOMEI_AUDIENCE
              value: "nagare-access"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shomei
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: shomei
    app.kubernetes.io/part-of: nagare-auth-plane
spec:
  selector:
    app.kubernetes.io/name: shomei
  ports:
    - name: http
      port: 80
      targetPort: 8080
