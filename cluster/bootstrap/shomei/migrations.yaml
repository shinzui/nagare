apiVersion: v1
kind: Namespace
metadata:
  name: nagare-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shomei-migrate
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: shomei
    app.kubernetes.io/part-of: nagare-auth-plane
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shomei
        app.kubernetes.io/part-of: nagare-auth-plane
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          # The Shomei image carries both shomei-server and shomei-migrate from
          # the same source checkout, keeping its embedded plan in lockstep.
          image: ${NAGARE_REGISTRY_PREFIX}/shomei:${NAGARE_AUTH_TAG}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          command:
            - /usr/local/bin/shomei-migrate
          args:
            - up
          env:
            - name: PGHOST
              value: shomei-db.nagare-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nagare-db-shomei-db
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nagare-db-shomei-db
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: nagare-db-shomei-db
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "host=$(PGHOST) port=$(PGPORT) dbname=$(PGDATABASE) user=$(PGUSER) password=$(PGPASSWORD)"
