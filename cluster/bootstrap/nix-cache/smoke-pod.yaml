apiVersion: v1
kind: ConfigMap
metadata:
  name: nagare-nix-cache-smoke-source
  namespace: personal
data:
  flake.nix: |
    {
      inputs.nixpkgs.url = "github:NixOS/nixpkgs/9b008d60392981ad674e04016d25619281550a9d";
      outputs = { nixpkgs, ... }: {
        packages.x86_64-linux.default = nixpkgs.legacyPackages.x86_64-linux.writeText
          "nagare-attic-smoke" "nagare-attic-smoke-v1\n";
      };
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: nix-cache-smoke
  namespace: personal
  labels: {nagare.dev/nix-cache-client: "true"}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: nix
      image: nixos/nix@sha256:85169a7ff4ac6928b70b15ced20c74770e07e8fbc7f97e92f64c1fca47ea9486
      command: ["sh", "-ceu"]
      args:
        - |
          out="$(nix build /source#default --no-write-lock-file --no-link --print-out-paths --max-jobs 0 --option fallback false -L)"
          test "$(cat "$out")" = nagare-attic-smoke-v1
          echo "substituted $out from http://nix-cache.nagare-system.svc.cluster.local/nagare-cache"
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumeMounts:
        - {name: nix-config, mountPath: /etc/nix/nix.conf, subPath: nix.conf, readOnly: true}
        - {name: source, mountPath: /source, readOnly: true}
  volumes:
    - name: nix-config
      configMap: {name: nagare-nix-cache-client}
    - name: source
      configMap: {name: nagare-nix-cache-smoke-source}
---
apiVersion: v1
kind: Pod
metadata:
  name: nix-cache-smoke-wrong-key
  namespace: personal
  labels: {nagare.dev/nix-cache-client: "true"}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: nix
      image: nixos/nix@sha256:85169a7ff4ac6928b70b15ced20c74770e07e8fbc7f97e92f64c1fca47ea9486
      command: ["sh", "-ceu"]
      args:
        - |
          if nix build /source#default --no-write-lock-file --no-link --print-out-paths --max-jobs 0 --option fallback false -L; then
            echo "unexpectedly trusted the wrong key" >&2
            exit 1
          fi
          echo "wrong key rejected as expected"
      env:
        - name: NIX_CONFIG
          value: |
            substituters = http://nix-cache.nagare-system.svc.cluster.local/nagare-cache
            trusted-public-keys = nagare-cache-1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumeMounts:
        - {name: source, mountPath: /source, readOnly: true}
  volumes:
    - name: source
      configMap: {name: nagare-nix-cache-smoke-source}
