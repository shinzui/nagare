apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nix-cache-server
  namespace: nagare-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: personal}
          podSelector:
            matchLabels: {nagare.dev/nix-cache-client: "true"}
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: nagare-system}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {nagare.dev/database: nix-cache-db}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nix-cache-clients
  namespace: personal
spec:
  podSelector:
    matchLabels: {nagare.dev/nix-cache-client: "true"}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: nagare-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: nix-cache}
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 8080}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
