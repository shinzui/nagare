apiVersion: v1
kind: Secret
metadata:
  name: nagare-nix-cache-storage
  namespace: nagare-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_WITH_PULUMI_OUTPUT
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_PULUMI_SECRET_OUTPUT
---
apiVersion: v1
kind: Secret
metadata:
  name: nagare-nix-cache-token-key
  namespace: nagare-system
type: Opaque
stringData:
  ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64: REPLACE_WITH_BASE64_PKCS1_RSA_PRIVATE_KEY
