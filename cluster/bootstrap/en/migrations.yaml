apiVersion: v1
kind: Namespace
metadata:
  name: nagare-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: en-migrate
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: en
    app.kubernetes.io/part-of: nagare-auth-plane
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: en
        app.kubernetes.io/part-of: nagare-auth-plane
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          # The en image carries both en-server and en-migrate from the same
          # source checkout, so the executable's embedded migration plan always
          # matches the server being deployed.
          image: ${NAGARE_REGISTRY_PREFIX}/en:${NAGARE_AUTH_TAG}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          # A small administrative CLI applying embedded SQL; fixed bounds.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          command:
            - /usr/local/bin/en-migrate
          args:
            - up
          env:
            - name: PGHOST
              value: en-db.nagare-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nagare-db-en-db
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nagare-db-en-db
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: nagare-db-en-db
                  key: POSTGRES_DB
