apiVersion: v1
kind: Namespace
metadata:
  name: nagare-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: en
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: en
    app.kubernetes.io/part-of: nagare-auth-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: en
  template:
    metadata:
      labels:
        app.kubernetes.io/name: en
        app.kubernetes.io/part-of: nagare-auth-plane
    spec:
      containers:
        - name: en
          image: us-west1-docker.pkg.dev/tan-nb-exp/nagare/en:latest
          ports:
            - containerPort: 8080
          env:
            - name: EN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: en-db
                  key: EN_DATABASE_URL
            - name: EN_PORT
              value: "8080"
            - name: EN_SCHEMA_PATH
              value: /etc/en/schema/app.en
            - name: EN_DECISION_CACHE_MAX_ENTRIES
              value: "10000"
            - name: EN_TUPLE_READ_CACHE_MAX_ENTRIES
              value: "10000"
            - name: EN_OPTIMIZED_REVISION_CACHE_TTL_MS
              value: "5000"
          volumeMounts:
            - name: schema
              mountPath: /etc/en/schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: en-schema
---
apiVersion: v1
kind: Service
metadata:
  name: en
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: en
    app.kubernetes.io/part-of: nagare-auth-plane
spec:
  selector:
    app.kubernetes.io/name: en
  ports:
    - name: http
      port: 80
      targetPort: 8080
