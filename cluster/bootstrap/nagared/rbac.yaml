# RBAC for the nagared webhook runner (EP-16).
#
# nagared invokes the reviewed `nagarectl site` command. This example grants
# native Service, DomainMapping, and release-history ConfigMap permissions in
# `personal`. Additional accepted site members may require more permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nagared
  namespace: personal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nagared
  namespace: personal
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "domainmappings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nagared
  namespace: personal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nagared
subjects:
  - kind: ServiceAccount
    name: nagared
    namespace: personal
---
# Cluster-wide reads are required to prove that a hostname is not already
# claimed or routed in another namespace before nagared applies a mapping.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nagared-domain-preflight
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["domainmappings"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.internal.knative.dev"]
    resources: ["clusterdomainclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nagared-domain-preflight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nagared-domain-preflight
subjects:
  - kind: ServiceAccount
    name: nagared
    namespace: personal
