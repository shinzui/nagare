apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    # Let's Encrypt production endpoint. While iterating on DNS-01 you may
    # switch to the staging endpoint
    # https://acme-staging-v02.api.letsencrypt.org/directory to avoid
    # production rate limits; staging certs are NOT browser-trusted.
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nadeem@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          cloudDNS:
            # GCP project that owns the Cloud DNS managed zone (from EP-2).
            project: tan-nb-exp
            # No serviceAccountSecretRef: use the VM's ambient Application
            # Default Credentials (the attached service account holds
            # roles/dns.admin, granted by EP-2). GKE Workload Identity does
            # not exist on self-managed k3s, so ambient creds are the
            # mechanism here.
