apiVersion: v1
kind: Namespace
metadata:
  name: nagare-system
---
apiVersion: v1
kind: Secret
metadata:
  name: nagare-access
  namespace: nagare-system
  labels:
    app.kubernetes.io/name: nagare-access
    app.kubernetes.io/part-of: nagare-auth-plane
type: Opaque
stringData:
  # Generate a long random value, for example:
  #   openssl rand -base64 48
  cookie-key: CHANGE_ME_RANDOM_COOKIE_SIGNING_KEY
