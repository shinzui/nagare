# Helm values for open-telemetry/opentelemetry-collector (chart 0.158.0), in the
# `tracing` namespace as release `otel-collector`. The Collector RECEIVES OTLP from
# apps (gRPC 4317 / HTTP 4318) and EXPORTS traces to VictoriaTraces on 10428 at
# /insert/opentelemetry/v1/traces. The 4317/4318 ports are the COLLECTOR's — the
# address EP-6 apps target — not VictoriaTraces'.
# EP-5 Milestone M3.

mode: deployment              # one long-running Collector pod (not a per-node DaemonSet)

# Use the contrib image so the otlphttp exporter and common processors exist.
# In this chart version BOTH the repository and command.name must be set for contrib,
# otherwise the launched binary name (otelcol) does not match the contrib image.
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

# The default config's memory_limiter uses limit_percentage of the container's
# memory limit, so a limit must be set for deterministic startup.
# CPU request trimmed to 25m (EP-2 M4): on the 2-vCPU node the observability CPU
# *requests* must leave room for an app + a database to co-schedule. The 250m CPU
# limit still allows bursting; only the guaranteed reservation is reduced.
resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 25m
    memory: 128Mi

# OTLP receiver ports are enabled by default in this chart; listed here for clarity.
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

# The chart ships a default config (receivers otlp/jaeger/zipkin/prometheus,
# processors memory_limiter+batch, exporter debug, the mandatory health_check
# extension, and logs/metrics/traces pipelines). Helm deep-merges the maps below
# onto it. We ADD the VictoriaTraces exporter and RETARGET only the traces
# pipeline's exporter list. The logs/metrics pipelines keep the default `debug`
# exporter (a no-op in v1: app metrics arrive via VMAgent scrape and logs via the
# VictoriaLogs collector, not through this Collector).
config:
  exporters:
    # Forward traces to VictoriaTraces over OTLP/HTTP.
    otlphttp/victoriatraces:
      traces_endpoint: http://victoria-traces-vt-single-server.tracing.svc:10428/insert/opentelemetry/v1/traces
  service:
    pipelines:
      traces:
        # Replaces the default [debug]; receivers/processors keep chart defaults.
        exporters:
          - otlphttp/victoriatraces
