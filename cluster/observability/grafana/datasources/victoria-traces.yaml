# Grafana datasource provisioning file. This is the single source of truth, applied
# by install.sh as a ConfigMap labelled grafana_datasource=1 for Grafana's datasource
# sidecar. The Jaeger type points at VictoriaTraces' Jaeger-compatible query API.
apiVersion: 1
datasources:
  - name: VictoriaTraces
    type: jaeger
    access: proxy
    url: http://victoria-traces-vt-single-server.tracing.svc:10428/select/jaeger
    editable: true
