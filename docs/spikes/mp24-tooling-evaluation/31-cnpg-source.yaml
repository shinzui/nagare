# CloudNativePG source cluster `src` (one instance, PostgreSQL from the operator
# default image) archiving WAL and base backups to the prototype object store
# through the barman-cloud plugin.
apiVersion: v1
kind: Namespace
metadata:
  name: pgeval
  labels: {nagare.dev/owner: ep-163}
---
apiVersion: v1
kind: Secret
metadata: {name: s3, namespace: pgeval}
stringData:
  ACCESS_KEY_ID: evalroot
  ACCESS_SECRET_KEY: eval-root-password
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata: {name: store, namespace: pgeval}
spec:
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://minio.minio:9000
    s3Credentials:
      accessKeyId: {name: s3, key: ACCESS_KEY_ID}
      secretAccessKey: {name: s3, key: ACCESS_SECRET_KEY}
    wal: {compression: gzip}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: src, namespace: pgeval}
spec:
  instances: 1
  storage: {size: 1Gi}
  bootstrap:
    initdb: {database: appdb, owner: app}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: store}
