# sops policy for the in-repo NixOS evaluation fixture.
#
# The recipient below is an EXAMPLE: its private key was generated once to encrypt
# hosts/nagare-01/secrets/example.yaml and then discarded, so nobody can decrypt
# that file. Real operators keep their host's encrypted secrets and recipients in
# their own context-owned host flake (`nagarectl host init --sops-file`), outside
# this public repository.
keys:
  - &example_host age13dryrvm279xsxwtuun8xuy6u9eehjthz78e0823excrf6yrn6u0s5ssw63
creation_rules:
  - path_regex: hosts/nagare-01/secrets/.*\.yaml$
    key_groups:
      - age:
          - *example_host
