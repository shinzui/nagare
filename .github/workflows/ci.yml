name: CI

# EP-5 (docs/plans/69, MasterPlan 13). The default job runs the root flake's
# hermetic `checks` output. A separate compatibility job retains the older,
# networked nagare-access check until that package is migrated to Nix.

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Use and populate the Nagare binary cache
        # Pulls from shinzui.cachix.org, then pushes this job's build results so a
        # later run of the same revision (the tag run after a release rehearsal)
        # substitutes instead of rebuilding. Without CACHIX_AUTH_TOKEN it only pulls.
        # useDaemon: false pushes once at job end; the daemon's short shutdown grace
        # can leave large macOS paths unpushed and fail the job.
        uses: cachix/cachix-action@v17
        with:
          name: shinzui
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          useDaemon: false

      - name: Run the flake checks (the source of truth)
        # The checks ARE the CI: if any cluster/examples/*/nagare/Config.hs stops
        # compiling, either Haskell test suite fails, or a shell script has an
        # error-level shellcheck finding, this step fails the build.
        run: nix flake check --print-build-logs --max-jobs 1

  nagare-access-check:
    name: nagare-access compatibility check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = relaxed

      - name: Configure private dependency access
        env:
          NAGARE_DEPENDENCY_TOKEN: ${{ secrets.NAGARE_DEPENDENCY_TOKEN }}
        run: |
          if [ -z "${NAGARE_DEPENDENCY_TOKEN}" ]; then
            echo "::error title=Missing NAGARE_DEPENDENCY_TOKEN::Create a repository secret with read access to private source-repository-package dependencies such as shinzui/en."
            exit 1
          fi
          sudo git config --system \
            url."https://x-access-token:${NAGARE_DEPENDENCY_TOKEN}@github.com/shinzui/".insteadOf \
            "https://github.com/shinzui/"

      - name: Build and test nagare-access
        run: nix build .#hydraJobs.x86_64-linux.nagare-access-build-test --print-build-logs
