name: Live Smoke

# EP-5 (docs/plans/69, MasterPlan 13) + EP-101: manual trigger plus a monthly
# scheduled drill so the live backup/restore path cannot silently rot. This
# deploys to the real cluster and requires the running VM + GCP credentials.
# Until the auth step below is wired, scheduled runs fail fast there as a
# deliberate reminder. Never runs on push/PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *" # 06:23 UTC on the first day of each month

jobs:
  live-smoke:
    name: live smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = relaxed

      - name: Configure private dependency access
        env:
          NAGARE_DEPENDENCY_TOKEN: ${{ secrets.NAGARE_DEPENDENCY_TOKEN }}
        run: |
          if [ -z "${NAGARE_DEPENDENCY_TOKEN}" ]; then
            echo "::error title=Missing NAGARE_DEPENDENCY_TOKEN::Create a repository secret with read access to private source-repository-package dependencies such as shinzui/en."
            exit 1
          fi
          sudo git config --system \
            url."https://x-access-token:${NAGARE_DEPENDENCY_TOKEN}@github.com/shinzui/".insteadOf \
            "https://github.com/shinzui/"

      - name: Authenticate to GCP
        # Configure credentials so gcloud/nagarectl can reach the target project
        # (e.g. a service-account key in repo secrets, or Workload Identity
        # Federation). The smoke script's _require_target_project guardrail still
        # refuses to act on any project but the configured target.
        run: |
          echo "::error title=GCP authentication not configured::Configure a service-account key or Workload Identity Federation before invoking the live smoke test."
          exit 1

      - name: Run the live smoke test inside the dev shell
        # The dev shell ships nagarectl's toolchain, gcloud, kubectl, and just.
        run: nix develop --command just smoke
