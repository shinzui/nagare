# Shared Fourmolu config for the maintained cli/ Haskell tree: nagare-dsl,
# nagarectl (including nagared), and nagare-access. The settings preserve the
# established leading-comma and single-line Haddock conventions while giving
# every package one formatter contract.
indentation: 2
function-arrows: trailing
comma-style: leading
import-export-style: leading
indent-wheres: true
record-brace-space: true
newlines-between-decls: 1
haddock-style: single-line
haddock-style-module:
let-style: inline
in-style: right-align
respectful: false
fixities: []
unicode: never
