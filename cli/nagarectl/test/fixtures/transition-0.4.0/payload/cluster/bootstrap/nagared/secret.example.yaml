# Webhook secret template for nagared (EP-16). Copy to secret.yaml, fill in, and
# apply — do NOT commit the filled-in copy.
#
#   webhook-secret  the shared secret you also enter in the GitHub webhook UI;
#                   nagared verifies X-Hub-Signature-256 (HMAC-SHA256) against it.
#   git-token       optional token for cloning private repositories (used by the
#                   checkout step); omit for public repos.
apiVersion: v1
kind: Secret
metadata:
  name: nagared
  namespace: personal
type: Opaque
stringData:
  webhook-secret: "CHANGE-ME-to-a-long-random-string"
  git-token: ""
