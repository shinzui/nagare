apiVersion: serving.knative.dev/v1beta1
kind: DomainMapping
metadata:
  name: notes.example.com
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/canonical: 'true'
    nagare.dev/service: hello
spec:
  ref:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: hello
---
apiVersion: serving.knative.dev/v1beta1
kind: DomainMapping
metadata:
  name: www.example.com
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/canonical: 'false'
    nagare.dev/service: hello
spec:
  ref:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: hello
