apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tasks
  namespace: personal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/max-scale: '5'
    spec:
      containers:
      - image: gcr.io/myproject/tasks:20260602-120000
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tasks-db
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: nagare-env-tasks-runtime
            optional: true
        - secretRef:
            name: nagare-secret-tasks-runtime
            optional: true
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
