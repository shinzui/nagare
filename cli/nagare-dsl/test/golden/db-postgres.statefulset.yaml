apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-main
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: pg-main
    nagare.dev/engine: postgres
  annotations:
    nagare.dev/retention: Retain
    nagare.dev/size: 10Gi
    nagare.dev/version: '18'
spec:
  serviceName: pg-main
  replicas: 1
  selector:
    matchLabels:
      nagare.dev/database: pg-main
  template:
    metadata:
      labels:
        nagare.dev/managed-by: nagarectl
        nagare.dev/database: pg-main
        nagare.dev/engine: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nagare-db-pg-main
              key: POSTGRES_PASSWORD
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: nagare-db-pg-main
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: nagare-db-pg-main
              key: POSTGRES_DB
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -q -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nagare-db-pg-main-data
