apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: analytics
    nagare.dev/engine: clickhouse
spec:
  serviceName: analytics
  replicas: 1
  selector:
    matchLabels:
      nagare.dev/database: analytics
  template:
    metadata:
      labels:
        nagare.dev/managed-by: nagarectl
        nagare.dev/database: analytics
        nagare.dev/engine: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:25.8
        ports:
        - containerPort: 9000
        - containerPort: 8123
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nagare-db-analytics
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: nagare-db-analytics
              key: CLICKHOUSE_USER
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: config
          mountPath: /etc/clickhouse-server/config.d/low-memory.xml
          subPath: low-memory.xml
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nagare-db-analytics-data
      - name: config
        configMap:
          name: nagare-db-analytics-mem
