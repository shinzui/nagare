apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: analytics
    nagare.dev/engine: clickhouse
  annotations:
    nagare.dev/retention: Retain
    nagare.dev/size: 5Gi
    nagare.dev/version: '26.8'
spec:
  serviceName: analytics
  replicas: 1
  selector:
    matchLabels:
      nagare.dev/database: analytics
  template:
    metadata:
      labels:
        nagare.dev/managed-by: nagarectl
        nagare.dev/database: analytics
        nagare.dev/engine: clickhouse
      annotations:
        nagare.dev/config-digest: eea29667cdddbf7f601b1cb42effef3e86c23fa9ef441edf0fff65023fcc0a49
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:26.8
        ports:
        - containerPort: 9000
        - containerPort: 8123
        env:
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: '1'
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nagare-db-analytics
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: nagare-db-analytics
              key: CLICKHOUSE_USER
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: config
          mountPath: /etc/clickhouse-server/config.d/low-memory.xml
          subPath: low-memory.xml
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nagare-db-analytics-data
      - name: config
        configMap:
          name: nagare-db-analytics-mem
