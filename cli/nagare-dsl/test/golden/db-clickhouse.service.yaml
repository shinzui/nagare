apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: analytics
    nagare.dev/engine: clickhouse
spec:
  type: ClusterIP
  selector:
    nagare.dev/database: analytics
  ports:
  - name: native
    port: 9000
    targetPort: 9000
  - name: http
    port: 8123
    targetPort: 8123
