apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagare-vol-hello-data
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/app: hello
    nagare.dev/volume: data
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
