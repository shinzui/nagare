apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagare-db-analytics-data
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: analytics
    nagare.dev/engine: clickhouse
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
