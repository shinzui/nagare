apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: notes
  namespace: personal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: '1'
        autoscaling.knative.dev/max-scale: '5'
    spec:
      containers:
      - image: gcr.io/myproject/notes:20260602-120000
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
