apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagare-db-redis-cache-data
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: redis-cache
    nagare.dev/engine: redis
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
