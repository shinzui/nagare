apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagare-db-pg-main-data
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/database: pg-main
    nagare.dev/engine: postgres
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
