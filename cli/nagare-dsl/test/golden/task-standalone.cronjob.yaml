apiVersion: batch/v1
kind: CronJob
metadata:
  name: nagare-task-cleanup
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/task: cleanup
spec:
  schedule: 0 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            nagare.dev/managed-by: nagarectl
            nagare.dev/task: cleanup
        spec:
          restartPolicy: Never
          containers:
          - name: cleanup
            image: gcr.io/myproject/notes
            command:
            - python
            - manage.py
            - cleanup
            env:
            - name: DRY_RUN
              value: 'false'
