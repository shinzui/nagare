apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagare-broker-events-data
  namespace: personal
  labels:
    nagare.dev/managed-by: nagarectl
    nagare.dev/broker: events
    nagare.dev/broker-provider: redpanda
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
