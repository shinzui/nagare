# .sops.yaml — sops policy shape for Nagare cluster secrets (EP-7).
#
# creation_rules are matched top-to-bottom; the first whose path_regex matches a
# file decides how `sops -e` encrypts it. sops uses the NEAREST .sops.yaml, so this
# file governs only `cluster/secrets/`; the NixOS evaluation fixture's example host
# secret is governed by `nixos/.sops.yaml`.
#
# This public repository carries no operator's encrypted secrets or recipients
# (ExecPlan 116). The recipient below is an EXAMPLE whose private key was discarded.
# Operators keep their encrypted Kubernetes Secrets in a context-owned directory,
#   ${XDG_CONFIG_HOME:-~/.config}/nagare/cluster-secrets/<context>/
# (or NAGARE_CLUSTER_SECRETS_DIR), with their own `.sops.yaml` naming their own
# workstation recipient — typically in a private operator repository. See
# docs/user/secrets.md.
#
# Decrypting may need the identity file named explicitly — this sops build does
# not search ~/.config/sops/age/keys.txt on its own:
#   SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops -d <file>.yaml
creation_rules:
  # Kubernetes Secret manifests. Encrypt ONLY the data/stringData values so keys
  # and metadata stay readable in diffs.
  - path_regex: cluster/secrets/.*\.ya?ml$
    encrypted_regex: "^(data|stringData)$"
    age: >-
      age13dryrvm279xsxwtuun8xuy6u9eehjthz78e0823excrf6yrn6u0s5ssw63
